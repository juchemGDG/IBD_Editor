name: Pakete bauen

# PyInstaller kann nicht über Plattformen hinweg bauen: die Windows-.exe muss
# auf Windows entstehen, die .app/.dmg auf macOS, die .tar.gz und das
# AppImage auf Linux. Dieser Workflow erledigt alles auf GitHubs Runnern.
#
# Starten:  Actions → "Pakete bauen" → Run workflow
#           (oder automatisch beim Pushen eines Tags v1.2.3)
# Ergebnis: die drei Pakete als Artefakte unterhalb des Workflow-Laufs – beim
#           Tag zusätzlich als Dateien am GitHub-Release. Genau die verlinkt der
#           Menüpunkt "Desktop-Version" der Web-App (GITHUB_REPO in web/static/ibd.js).
#
# Die Dateinamen am Release muessen stabil bleiben (ohne Versionsnummer),
# damit die Web-App sie immer findet.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller ibd_editor.spec --distpath build/windows/dist --workpath build/windows/work --noconfirm

      - name: Installer mit Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc packaging\ibd_editor.iss

      - name: Ordner-Variante zippen (ohne Installer nutzbar)
        shell: pwsh
        run: Compress-Archive -Path build\windows\dist\IBD-Editor\* -DestinationPath dist\IBD-Editor-windows-x86_64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: IBD-Editor-Windows
          path: |
            dist/IBD-Editor-Setup.exe
            dist/IBD-Editor-windows-x86_64.zip

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller ibd_editor.spec --distpath build/macos/dist --workpath build/macos/work --noconfirm

      - name: DMG erzeugen
        run: |
          mkdir -p dist
          hdiutil create -volname "IBD Editor" -srcfolder build/macos/dist/IBD-Editor.app -ov -format UDZO dist/IBD-Editor.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: IBD-Editor-macOS
          path: dist/IBD-Editor.dmg

  linux:
    name: Linux (.tar.gz + AppImage)
    # bewusst die ältere LTS: das Ergebnis läuft dann auch auf älteren Distributionen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pywebview nutzt unter Linux GTK + WebKit; PyGObject wird aus den Quellen gebaut
      - name: GTK/WebKit-Bibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          # nur fürs AppImage: .pc-Dateien und Werkzeuge für linuxdeploy-plugin-gtk
          sudo apt-get install -y libgtk-3-dev librsvg2-dev librsvg2-common dpkg-dev
          pip install "PyGObject<3.51"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller ibd_editor.spec --distpath build/linux/dist --workpath build/linux/work --noconfirm

      # Das .tar.gz nutzt das GTK/WebKit des Zielsystems. Die libstdc++ von
      # 22.04 im Paket würde dessen neuere Bibliotheken (z. B. ICU) brechen:
      # "CXXABI_1.3.15 not found". Die des Zielsystems ist immer neu genug.
      - name: libstdc++ aus dem Paket entfernen
        run: find build/linux/dist/IBD-Editor \( -name 'libstdc++.so*' -o -name 'libgcc_s.so*' \) -print -delete

      - name: AppImage erzeugen (bringt WebKitGTK selbst mit)
        run: packaging/build_appimage.sh build/linux/dist/IBD-Editor dist/IBD-Editor-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: IBD-Editor-Linux-AppImage
          path: dist/IBD-Editor-x86_64.AppImage

      - name: tar.gz erzeugen
        run: |
          mkdir -p dist
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexec ./IBD-Editor "$@"\n' > build/linux/dist/IBD-Editor/starten.sh
          chmod +x build/linux/dist/IBD-Editor/starten.sh
          tar -czf dist/IBD-Editor-1.0.0-linux-x86_64.tar.gz -C build/linux/dist IBD-Editor

      - uses: actions/upload-artifact@v7
        with:
          name: IBD-Editor-Linux
          path: dist/IBD-Editor-1.0.0-linux-x86_64.tar.gz

  appimage-test:
    name: AppImage-Test (Ubuntu 26.04)
    # startet das AppImage auf einem neueren System als dem Build-System –
    # genau dort ist das .tar.gz früher an der libstdc++ gescheitert
    needs: linux
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IBD-Editor-Linux-AppImage

      # nur, was jeder Desktop ohnehin hat (X11, Mesa, Fontconfig, …) –
      # alles Weitere muss das AppImage selbst mitbringen
      - name: Minimales Desktop-System
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth procps libgl1 libegl1 libgl1-mesa-dri libegl-mesa0 libgbm1 \
            libfontconfig1 libharfbuzz0b libfribidi0 libx11-xcb1 libwayland-client0 fonts-dejavu-core

      - name: Starten und prüfen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x IBD-Editor-x86_64.AppImage
          xvfb-run -a ./IBD-Editor-x86_64.AppImage > app.log 2>&1 &
          sleep 30
          ok=1
          pgrep -f 'usr/lib/ibd-editor/IBD-Editor' > /dev/null || { echo "::error::Die App läuft nicht mehr"; ok=0; }
          pgrep -f WebKitWebProcess > /dev/null || { echo "::error::WebKitWebProcess wurde nicht gestartet"; ok=0; }
          if grep -E "version .* not found|error while loading shared libraries|cannot open shared object|Unable to spawn|Traceback" app.log; then
            echo "::error::Fehlermeldungen im Log"; ok=0
          fi
          echo "----- Log -----"; cat app.log
          pkill -f 'usr/lib/ibd-editor/IBD-Editor' || true
          [ "$ok" = 1 ]

  release:
    name: Release-Dateien anhängen
    needs: [windows, macos, linux, appimage-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefakte

      - name: Dateien einsammeln (stabile Namen ohne Versionsnummer)
        run: |
          mkdir -p release
          # Gesucht statt fest verdrahtet: so bleibt der Schritt heil, falls
          # actions/download-artifact die Ordnerstruktur einmal aendert.
          hole() {   # $1 = Suchmuster, $2 = Zielname am Release
            treffer="$(find artefakte -type f -name "$1" | head -1)"
            if [ -z "$treffer" ]; then
              echo "::error::Artefakt $1 nicht gefunden"; return 1
            fi
            cp "$treffer" "release/$2"
          }
          hole 'IBD-Editor.dmg'                   'IBD-Editor.dmg'
          hole 'IBD-Editor-Setup.exe'             'IBD-Editor-Setup.exe'
          hole 'IBD-Editor-windows-x86_64.zip'    'IBD-Editor-windows-x86_64.zip'
          hole 'IBD-Editor-*linux-x86_64.tar.gz'  'IBD-Editor-linux-x86_64.tar.gz'
          hole 'IBD-Editor-x86_64.AppImage'       'IBD-Editor-x86_64.AppImage'
          ls -lh release

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dieser Job checkt das Repository nicht aus (er braucht nur die
          # Artefakte). Ohne Git-Verzeichnis kann die gh-CLI das Repository
          # nicht selbst ermitteln – deshalb wird es explizit angegeben.
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG existiert – Dateien werden angehängt."
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          else
            echo "Release $TAG anlegen."
            gh release create "$TAG" release/* --repo "$REPO" \
              --title "IBD Editor $TAG" --generate-notes
          fi
          echo "Dateien am Release:"
          # nur zur Kontrolle – darf den Job nicht scheitern lassen
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) Bytes"' || true
