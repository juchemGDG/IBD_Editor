<svg width="1024" height="1024" viewBox="96 96 832 832" xmlns="http://www.w3.org/2000/svg">
  <!-- IBD-Editor-Logo: Mini-Informationsfluss (Bauteil -> Verarbeitung ->
       Rückgabe in Variable -> Bauteil) im selben Stil wie PAP Editor /
       Notenchecker. Quelle für alle Icon-Dateien, erzeugt mit:
       python3 packaging/make_icons.py -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2CC9AE"/>
      <stop offset="1" stop-color="#0E7F86"/>
    </linearGradient>
  </defs>

  <!-- abgerundetes Quadrat mit Rand, wie bei macOS-App-Icons -->
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#bg)"/>

  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bauteile (eckig): Quelle oben links, Ziel unten links -->
    <rect x="196" y="236" width="172" height="172" rx="10" stroke="none"/>
    <rect x="196" y="616" width="172" height="172" rx="10" stroke="none"/>
    <circle cx="282" cy="322" r="38" fill="#1FAE9F" stroke="none"/>
    <circle cx="282" cy="702" r="38" fill="#14918F" stroke="none"/>

    <!-- Verarbeitung (abgerundet) -->
    <rect x="532" y="236" width="300" height="172" rx="64" stroke="none"/>

    <!-- Variable (doppelter Rand) -->
    <rect x="532" y="616" width="300" height="172" rx="18" fill="none" stroke-width="24"/>
    <rect x="574" y="658" width="216" height="88" rx="6" fill="none" stroke-width="14"/>

    <!-- Bauteilsignal: Quelle -> Verarbeitung -->
    <path d="M368 322 H486" fill="none" stroke-width="30"/>
    <path d="M482 294 L520 322 L482 350 Z" stroke-width="14"/>

    <!-- Rückgabewert: breit, Punkt am Anfang -->
    <circle cx="682" cy="438" r="30" stroke="none"/>
    <path d="M682 438 V556" fill="none" stroke-width="44"/>
    <path d="M644 552 L682 598 L720 552 Z" stroke-width="14"/>

    <!-- Übergabewert: Variable -> Ziel -->
    <path d="M520 702 H414" fill="none" stroke-width="30"/>
    <path d="M418 674 L380 702 L418 730 Z" stroke-width="14"/>
  </g>
</svg>
